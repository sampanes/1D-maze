<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4D Hyper-Maze Architect</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div class="header">
    <h1>◆ 4D Hyper-Maze Architect ◆</h1>
    <p>Build in 4D, then scan a true 3D cross-section through x+w=constant with smooth hyper-shifting.</p>
    <div class="header-nav-links">
      <a href="scan3d.html" style="
        display: inline-block;
        font-size: 0.78rem;
        font-weight: 700;
        color: #7afcff;
        border: 1px solid rgba(122,252,255,0.28);
        border-radius: 999px;
        padding: 4px 12px;
        text-decoration: none;
        letter-spacing: 0.03em;
        transition: opacity 0.15s;
      ">← 3D Game</a>
    </div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="gridSlider">Grid Size (N)</label>
      <input id="gridSlider" type="range" min="3" max="10" value="5" step="1" />
      <span class="val" id="gridVal">5</span>
    </div>

    <div class="control-group">
      <label>Layer (x+w)</label>
      <button id="layerPrevBtn" class="layer-nav-btn">◀</button>
      <span id="layerDisplay" class="val">5</span>
      <button id="layerNextBtn" class="layer-nav-btn">▶</button>
    </div>

    <button id="btnScan" class="btn-scan" disabled>Start Scan</button>

    <button id="btnValidate" style="
        padding: 8px 16px;
        background: rgba(122,252,255,0.12);
        color: #7afcff;
        border-radius: 999px;
        border: 1px solid rgba(122,252,255,0.38);
        font-weight: 700;
        cursor: pointer;
      ">Validate</button>

    <button id="btnWipe" title="Clear active layer · Shift+click to clear all" style="
        padding: 8px 16px;
        background: rgba(255,106,106,0.12);
        color: #ff6a6a;
        border-radius: 999px;
        border: 1px solid rgba(255,106,106,0.38);
        font-weight: 700;
        cursor: pointer;
      ">Wipe Layer</button>

    <button id="btnResetView" style="
        padding: 8px 16px;
        background: rgba(122,252,255,0.12);
        color: #7afcff;
        border-radius: 999px;
        border: 1px solid rgba(122,252,255,0.38);
        font-weight: 700;
        cursor: pointer;
      ">Reset Camera</button>
  </div>

  <div id="statusBar" class="status-bar neutral">
    Edit: click a cube to toggle wall. Layer ◀▶ moves through hyperdiagonals (x+w = const). Centre layer holds Start and End.
  </div>

  <div class="maze-section">
    <div class="canvas-wrapper">
      <canvas id="hyperCanvas" width="800" height="600" style="background: #0d1018; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5);"></canvas>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/4d/4d-core.js"></script>
  <script src="js/4d/render4d.js"></script>
  <script src="js/4d/init4d.js"></script>
</body>
</html>
